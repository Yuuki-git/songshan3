name: Reproduction static checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate public files and pinned inputs without GPU
        run: python3 scripts/check_repository.py
      - name: Check failure reporting and run isolation
        run: python3 -m unittest discover -s tests -v
      - name: List operator stages without GPU
        run: python3 scripts/reproduce.py --list
